[package]
name = "rils_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Command-line tooling for the Rils scripting language"
license.workspace = true
repository.workspace = true

[[bin]]
name = "rils"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rils = { path = "../..", version = "0.3.0" }
