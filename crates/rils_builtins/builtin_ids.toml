# Stable built-in IDs. Reserve each documented 0x100 block for its module.

# General core operations: 0x0000-0x00FF.
[core]
clone = 0x0001

# Sequence operations: 0x0100-0x01FF.
[core.sequence]
len = 0x0100
into_iter = 0x0101
is_empty = 0x0102
contains = 0x0103

# Vec operations: 0x0200-0x02FF.
[core.vec]
