[package]
name = "rils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
description = "A Rust-inspired lightweight scripting language"
license.workspace = true
repository.workspace = true
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/examples/**",
    "/src/**",
]

[dependencies]
rils_compiler.workspace = true
rils_frontend.workspace = true
rils_builtins.workspace = true
rils_project.workspace = true
stacker = "0.1"

[workspace]
members = [
    ".",
    "crates/rils_compiler",
    "crates/rils_frontend",
    "crates/rils_builtins",
    "crates/rils_project",
    "tools/rils-capi",
    "tools/rils-analyzer",
    "tools/rils-cli",
    "tools/rils-up",
    "tools/rils-bench",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rils-lang/rils"

[workspace.dependencies]
rils_compiler = { version = "0.3.0", path = "crates/rils_compiler" }
rils_frontend = { version = "0.3.0", path = "crates/rils_frontend" }
rils_builtins = { version = "0.3.0", path = "crates/rils_builtins" }
rils_project = { version = "0.3.0", path = "crates/rils_project" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
